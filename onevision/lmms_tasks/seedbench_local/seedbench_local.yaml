dataset_path: parquet
dataset_kwargs:
  data_files: /workspace/hd/data/SEED-Bench-lmms-video-only-sharded/*.parquet
task: "seedbench_local"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.seed_doc_to_visual
doc_to_text: !function utils.seed_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  until:
    - "ASSISTANT:"
  image_aspect_ratio: original
process_results: !function utils.seed_process_result
metric_list:
  - metric: seed_image
    aggregation: !function utils.seed_aggregation_result
    higher_is_better: true
  - metric: seed_video
    aggregation: !function utils.seed_aggregation_result
    higher_is_better: true
  - metric: seed_all
    aggregation: !function utils.seed_aggregation_result
    higher_is_better: true
metadata:
  - version: 0.0
